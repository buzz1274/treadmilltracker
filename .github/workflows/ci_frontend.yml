
name: Frontend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: ESLint
        working-directory: frontend
        run: yarn eslint .

      - name: TypeScript type checking
        working-directory: frontend
        run: yarn type-check

      - name: Frontend tests
        working-directory: frontend
        run: |
          yarn vitest run --coverage --coverage.reporter=lco        
