
name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: treadmilltracker-production
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'index.html'
              - '.github/workflows/build_frontend.yml'
              - '.github/workflows/deploy_frontend.yml'
              - '.github/workflows/deploy.yml'

            backend:
              - 'backend/**'
              - '.github/workflows/build_backend.yml'
              - '.github/workflows/deploy_backend.yml'
              - '.github/workflows/deploy.yml'

  frontend-ci:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci_frontend.yml

  build-frontend:
    needs: [changes, frontend-ci]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/build_frontend.yml

  build-backend:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/build_backend.yml
    secrets: inherit

  deploy-frontend:
    needs: [changes, build-frontend, build-backend]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.build-frontend.result == 'success' &&
      (needs.build-backend.result == 'success' ||
       needs.build-backend.result == 'skipped')
    uses: ./.github/workflows/deploy_frontend.yml

  deploy-backend:
    needs: [changes, build-frontend, build-backend]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.build-backend.result == 'success' &&
      (needs.build-frontend.result == 'success' ||
       needs.build-frontend.result == 'skipped')
    uses: ./.github/workflows/deploy_backend.yml
