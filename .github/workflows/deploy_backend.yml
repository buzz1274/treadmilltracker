
name: Build and publish backend

'on':
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    environment: production

    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          path: treadmilltracker

      - name: Generate infrastructure access token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: buzz1274
          repositories: infra
          permission-contents: read

      - name: Check out infrastructure
        uses: actions/checkout@v4
        with:
          repository: buzz1274/infra
          token: ${{ steps.app-token.outputs.token }}
          path: infra
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::902048811339:role/github-actions-deploy-role
          aws-region: eu-west-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build ARM64 backend image
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --platform linux/arm64 \
            --build-arg ENVIRONMENT=production \
            --file infra/docker/websites/treadmilltracker/backend/Dockerfile \
            --tag "$ECR_REGISTRY/treadmilltracker-backend:$IMAGE_TAG" \
            treadmilltracker

      - name: Verify image architecture
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker image inspect \
            "$ECR_REGISTRY/treadmilltracker-backend:$IMAGE_TAG" \
            --format '{{.Os}}/{{.Architecture}}'

      - name: Push backend image to ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push "$ECR_REGISTRY/treadmilltracker-backend:$IMAGE_TAG"

      - name: Deploy backend via SSM
        id: deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --region eu-west-2 \
            --instance-ids i-011a162ba429e30d2 \
            --document-name zz50-deploy-docker \
            --parameters "Application=treadmilltracker,ImageTag=$IMAGE_TAG" \
            --query 'Command.CommandId' \
            --output text)

          if [[ ! "$COMMAND_ID" =~ ^[a-f0-9-]{36}$ ]]; then
            echo "Invalid SSM command ID: $COMMAND_ID" >&2
            exit 1
          fi      
          
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $COMMAND_ID"

      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          if aws ssm wait command-executed \
            --region eu-west-2 \
            --command-id "$COMMAND_ID" \
            --instance-id i-011a162ba429e30d2; then
            echo "SSM deployment completed successfully."
          else
            aws ssm get-command-invocation \
              --region eu-west-2 \
              --command-id "$COMMAND_ID" \
              --instance-id i-011a162ba429e30d2 \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
            exit 1
          fi          
